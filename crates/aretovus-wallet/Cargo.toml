[package]
name = "aretovus-wallet"
description = "ARETOVUS experimental ML-DSA testnet command-line wallet"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aretovus-core.workspace = true
aretovus-consensus.workspace = true
ml-dsa.workspace = true
getrandom.workspace = true
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
rpassword = "=7.5.4"
zeroize = "=1.9.1"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
