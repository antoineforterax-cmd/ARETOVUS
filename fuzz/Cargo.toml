[package]
license = "MIT OR Apache-2.0"
name = "aretovus-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
ed25519-dalek = "=2.2.0"
aretovus-consensus = { path = "../crates/aretovus-consensus" }
aretovus-core = { path = "../crates/aretovus-core" }
aretovus-node = { path = "../crates/aretovus-node" }
libfuzzer-sys = "=0.4.13"
ml-dsa = "=0.1.1"

[[bin]]
name = "canonical_decode"
path = "fuzz_targets/canonical_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merkle_proofs"
path = "fuzz_targets/merkle_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_payloads"
path = "fuzz_targets/network_payloads.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_state"
path = "fuzz_targets/account_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_account_state"
path = "fuzz_targets/native_account_state.rs"
test = false
doc = false
bench = false
