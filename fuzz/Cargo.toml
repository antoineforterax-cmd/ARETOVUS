[package]
license = "MIT OR Apache-2.0"
name = "aurora-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
aurora-consensus = { path = "../crates/aurora-consensus" }
aurora-core = { path = "../crates/aurora-core" }
aurora-node = { path = "../crates/aurora-node" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "canonical_decode"
path = "fuzz_targets/canonical_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merkle_proofs"
path = "fuzz_targets/merkle_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_payloads"
path = "fuzz_targets/network_payloads.rs"
test = false
doc = false
bench = false
