name: storage-windows-manifest-retry

on:
  pull_request:
    paths:
      - "crates/aretovus-storage/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/storage-windows-manifest-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-manifest-retry:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Repeated snapshot must resync its existing manifest on Windows
        run: cargo test --locked -p aretovus-storage --lib tests::repeated_snapshot_reuses_blocks_and_rejects_non_file_object -- --exact --nocapture
      - name: Retry after a failed directory sync must reach injected callback
        run: cargo test --locked -p aretovus-storage --lib tests::manifest_parent_sync_failure_leaves_visible_generation_recoverable -- --exact --nocapture
      - name: Run all storage regressions
        run: cargo test --locked -p aretovus-storage --lib
