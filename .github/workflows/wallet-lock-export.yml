name: wallet-lock-export

on:
  pull_request:
    paths:
      - "crates/aurora-wallet/Cargo.toml"
      - ".github/workflows/wallet-lock-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve wallet dependencies
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable fetch
      - name: Export reproducible lockfile
        run: |
          echo AURORA_LOCK_BEGIN
          base64 -w0 Cargo.lock
          echo
          echo AURORA_LOCK_END
