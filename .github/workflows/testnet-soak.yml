name: testnet-soak

on:
  push:
    branches: [feature/emission-schedule-v0]
    paths:
      - "scripts/testnet_soak.py"
      - "crates/aurora-node/**"
      - "crates/aurora-storage/**"
      - "crates/aurora-consensus/**"
      - ".github/workflows/testnet-soak.yml"
  workflow_dispatch:

concurrency:
  group: testnet-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  three-node-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Three-node restart and synchronization soak
        run: python3 scripts/testnet_soak.py --rounds 36 --interval-seconds 2
      - name: Preserve logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-soak-logs
          path: target/aurora-soak-*/**/*.log
          retention-days: 7
