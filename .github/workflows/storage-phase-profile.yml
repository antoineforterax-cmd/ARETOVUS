name: storage-phase-profile

on:
  push:
    branches: [test/storage-phase-profile-8192]
    paths:
      - "crates/aurora-storage/**"
      - ".github/workflows/storage-phase-profile.yml"
  pull_request:
    paths:
      - "crates/aurora-storage/**"
      - ".github/workflows/storage-phase-profile.yml"
  workflow_dispatch:
    inputs:
      blocks:
        description: "Blocks after genesis (256..16384)"
        required: false
        default: "2048"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Mesurer le stockage durable à chaque page de 64 blocs
        env:
          AURORA_STORAGE_PROFILE: "1"
          AURORA_STORAGE_PROFILE_BLOCKS: ${{ inputs.blocks || (github.ref == 'refs/heads/test/storage-phase-profile-8192' && '8192') || '2048' }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/test/storage-phase-profile-8192" ]; then
            test "$AURORA_STORAGE_PROFILE_BLOCKS" = 8192
          fi
          printf 'Selected storage profile: %s blocks after genesis\n' "$AURORA_STORAGE_PROFILE_BLOCKS"
          set -o pipefail
          /usr/bin/time -v cargo test --locked -p aurora-storage --lib repeated_snapshot_phase_profile_with_restart -- --exact --ignored --nocapture 2>&1 | tee storage-profile-results.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' storage-profile-results.log
          grep -q 'storage phases:' storage-profile-results.log
          grep -q 'storage volume probe:' storage-profile-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-phase-evidence
          path: storage-profile-results.log
          retention-days: 14
