name: real-enospc-tmpfs

on:
  pull_request:
    paths:
      - "crates/aretovus-storage/**"
      - ".github/workflows/real-enospc-tmpfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-enospc-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile the targeted regression before mounting tmpfs
        run: cargo test --locked -p aretovus-storage --lib --no-run
      - name: Fill isolated 32 MiB tmpfs, verify recovery and retry
        run: |
          set -euo pipefail
          mountdir="$(mktemp -d)"
          cleanup() {
            if mountpoint -q "$mountdir"; then sudo umount "$mountdir"; fi
            rmdir "$mountdir" || true
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o size=32m,nosuid,nodev tmpfs "$mountdir"
          sudo chown "$(id -u):$(id -g)" "$mountdir"
          test "$(findmnt -n -o FSTYPE --target "$mountdir")" = "tmpfs"
          test "$(findmnt -n -o TARGET --target "$mountdir")" = "$mountdir"
          df -h "$mountdir"
          AURORA_ENOSPC_PROBE=1 AURORA_ENOSPC_TEST_ROOT="$mountdir" \
            cargo test --locked -p aretovus-storage --lib tests::genuine_enospc_tmpfs_preserves_recovery_and_retry \
              -- --exact --ignored --nocapture 2>&1 | tee real-enospc-tmpfs.log
          grep -Fq 'test result: ok. 1 passed; 0 failed;' real-enospc-tmpfs.log
          grep -Fq 'real ENOSPC tmpfs: recovered prior tip and retried successfully' real-enospc-tmpfs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-enospc-tmpfs-evidence
          path: real-enospc-tmpfs.log
          retention-days: 14
