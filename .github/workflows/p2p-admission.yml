name: p2p-admission

on:
  push:
    paths:
      - 'crates/aretovus-node/**'
      - 'scripts/testnet_admission_probe.py'
      - '.github/workflows/p2p-admission.yml'
  pull_request:
    paths:
      - 'crates/aretovus-node/**'
      - 'scripts/testnet_admission_probe.py'
      - '.github/workflows/p2p-admission.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compiler le nœud proposé
        run: cargo build --locked -p aretovus-node
      - uses: actions/checkout@v4
        with:
          ref: b990ce84c06c8a2bd0ef1c6593c595e8b7ab3e61
          path: baseline
      - name: Compiler la référence avant correction
        run: cargo build --locked --manifest-path baseline/Cargo.toml --target-dir target/admission-baseline -p aurora-node
      - name: Mesurer la référence
        run: python3 scripts/testnet_admission_probe.py --binary target/admission-baseline/debug/aurora-node --report target/admission-before.json
      - name: Vérifier l'isolation des handshakes lents
        run: python3 scripts/testnet_admission_probe.py --binary target/debug/aretovus-node --post-handshake --max-wallet-seconds 1.5 --report target/admission-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2p-admission-measurements
          path: target/admission-*.json
          if-no-files-found: warn
          retention-days: 14
