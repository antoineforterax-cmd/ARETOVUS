name: wallet-file-open-cross-platform

on:
  pull_request:
    paths:
      - "crates/aretovus-wallet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wallet-file-open-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-file-open:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build wallet with locked dependencies
        run: cargo build --locked -p aretovus-wallet
      - name: Run wallet unit and file-open regression tests
        run: cargo test --locked -p aretovus-wallet --lib
