name: v2-desktop-frontend
on:
  push:
    branches: [feature/v2-tauri-readonly-dashboard-20261102, feature/v2-desktop-glass-ui-20261102]
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/v2-desktop-frontend.yml"
permissions:
  contents: read
jobs:
  types-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate JSON trust boundary
        run: npm test
      - name: Type-check and build React/Vite dashboard
        run: npm run build
      - name: Check glass theme fallback and status UI invariants
        run: python scripts/test_glass_style.py
