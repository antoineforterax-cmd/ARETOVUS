name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compilation
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Testnet multi-nœuds
        run: python3 scripts/testnet_smoke.py
      - name: Vérifier le lanceur d’endurance et sa collecte de mesures
        run: python3 scripts/testnet_endurance.py --binary target/debug/aurora-node --wallet target/debug/aurora-wallet --output target/endurance-ci --max-rounds 6 --restart-every 3 --interval-seconds 0
