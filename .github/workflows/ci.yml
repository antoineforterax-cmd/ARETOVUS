name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compilation
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Testnet multi-nœuds
        run: python3 scripts/testnet_smoke.py
# À ajouter plus tard (GOV-03) : cargo audit et cargo deny, une fois Cargo.lock committé.
