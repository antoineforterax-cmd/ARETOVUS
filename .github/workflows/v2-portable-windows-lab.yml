name: v2-portable-windows-lab
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/v2-portable-windows-lab.yml"
      - "crates/aretovus-node/**"
  push:
    branches: [feature/v2-portable-windows-lab-20261102]
permissions:
  contents: read
jobs:
  portable-lab:
    name: unsigned-Windows-lab
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adversarial packaging tests without executing binaries
        run: python -m unittest discover -s apps/desktop/scripts -p test_portable_windows_lab.py -v
      - name: Reject spoofed or missing GUI window evidence
        run: python -m unittest discover -s apps/desktop/scripts -p test_desktop_window_contract.py -v
      - name: Install exact frontend dependency graph
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Verify frontend and UI trust contract
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
          python scripts/test_glass_style.py
      - name: Verify native Tauri contract tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Windows desktop GUI without installer or auto-update
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Rust testnet node and two read-only companions
        run: cargo build --workspace --locked -p aretovus-node --bin aretovus-node --bin aretovus-local-bridge --bin aretovus-explorer
      - name: Verify actual local native node and companions on disposable data
        run: >-
          python apps/desktop/scripts/test_native_integration.py
          --node target/debug/aretovus-node.exe
          --bridge target/debug/aretovus-local-bridge.exe
          --explorer target/debug/aretovus-explorer.exe
      - name: Assemble unsigned testnet-only side-by-side portable ZIP
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          python apps/desktop/scripts/package_windows_lab.py pack `
            --desktop apps/desktop/src-tauri/target/debug/aretovus-desktop.exe `
            --bridge target/debug/aretovus-local-bridge.exe `
            --explorer target/debug/aretovus-explorer.exe `
            --node target/debug/aretovus-node.exe `
            --source-sha $sha `
            --output dist-windows/aretovus-desktop-Windows-lab-UNSIGNED.zip
          python apps/desktop/scripts/package_windows_lab.py verify `
            --archive dist-windows/aretovus-desktop-Windows-lab-UNSIGNED.zip
      - name: Exercise four extracted companion binaries from final verified ZIP
        shell: pwsh
        run: |
          python apps/desktop/scripts/test_packaged_windows_lab.py `
            --archive dist-windows/aretovus-desktop-Windows-lab-UNSIGNED.zip
      - name: Prove extracted desktop launches a visible stable Windows GUI window
        shell: pwsh
        run: |
          python apps/desktop/scripts/test_desktop_window.py `
            --archive dist-windows/aretovus-desktop-Windows-lab-UNSIGNED.zip
      - name: Publish short-lived CI artifact, NOT a signed release
        uses: actions/upload-artifact@v4
        with:
          name: aretovus-desktop-Windows-lab-UNSIGNED
          path: dist-windows/aretovus-desktop-Windows-lab-UNSIGNED.zip
          if-no-files-found: error
          retention-days: 3
