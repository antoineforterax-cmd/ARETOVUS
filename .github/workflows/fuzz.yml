name: fuzz

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and cargo-fuzz
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Fuzz canonical decoders
        run: cargo +nightly fuzz run canonical_decode -- -max_total_time=30 -print_final_stats=1
      - name: Fuzz Merkle proofs
        run: cargo +nightly fuzz run merkle_proofs -- -max_total_time=30 -print_final_stats=1
