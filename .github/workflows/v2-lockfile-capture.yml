name: v2-desktop-lockfile-capture
on:
  push:
    branches: [feature/v2-desktop-dependency-lock-20261102]
  pull_request:
    paths:
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - ".github/workflows/v2-lockfile-capture.yml"
permissions:
  contents: read
jobs:
  generate-locked-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve frontend lock only, never execute dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/desktop
      - name: Resolve isolated Tauri Cargo lock
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Emit public dependency manifests for maintainer verification
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          for (const [label, path] of [
            ['NPM', 'apps/desktop/package-lock.json'],
            ['CARGO', 'apps/desktop/src-tauri/Cargo.lock'],
          ]) {
            const raw = fs.readFileSync(path);
            const encoded = raw.toString('base64');
            console.log('ARETOVUS_LOCKFILE_BEGIN_' + label);
            for (let i = 0; i < encoded.length; i += 160) {
              console.log(encoded.slice(i, i + 160));
            }
            console.log('ARETOVUS_LOCKFILE_END_' + label);
            console.log('LOCKFILE_BYTES_' + label + '=' + raw.length);
          }
          JS
